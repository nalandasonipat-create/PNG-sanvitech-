/* ============ LAZY SCRIPT LOADER ============ */
const _loadedScripts = {};
function loadScriptOnce(src){
  if(_loadedScripts[src]) return _loadedScripts[src];
  _loadedScripts[src] = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>{ delete _loadedScripts[src]; reject(new Error("Failed to load "+src)); };
    document.head.appendChild(s);
  });
  return _loadedScripts[src];
}
async function ensurePdfLibs(){
  await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
}
async function ensureXlsxLib(){
  await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
}
function showToast(msg){
  const el = document.createElement("div");
  el.textContent = msg;
  el.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.3);";
  document.body.appendChild(el);
  return el;
}
function hideToast(el){ if(el && el.parentNode) el.parentNode.removeChild(el); }

function jobStageOf(c){ return (c && c.jobStage) || "contact"; }
function jobStageIndex(stage){ const i = JOB_STAGE_ORDER.indexOf(stage); return i<0?0:i; }
function isStageDone(c, stage){ return jobStageIndex(jobStageOf(c)) > jobStageIndex(stage); }
function isStageActive(c, stage){ return jobStageOf(c) === stage; }
function isStageLocked(c, stage){ return jobStageIndex(jobStageOf(c)) < jobStageIndex(stage); }

// Haversine distance in meters between two lat/lng points
function distanceMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function saveJobField(customerId, patch){
  if(db){
    try{ await db.doc("customers/"+customerId).update(patch); }
    catch(e){ console.error(e); alert("Save nahi ho paya, dobara try karein."); return false; }
  } else {
    const c = customers.find(c=>c.id===customerId);
    if(c){ Object.assign(c, patch); }
  }
  return true;
}
async function advanceJobStage(customerId, fromStage){
  const idx = jobStageIndex(fromStage);
  const next = JOB_STAGE_ORDER[idx+1] || "done";
  const patch = {jobStage: next};
  // Telecaller payout attribution: stamp the completion event once, the first time this job reaches "done"
  if(next === "done"){
    const nowIso = new Date().toISOString();
    patch.status = "completed"; patch.workStatus = "Completed"; patch.giWork = "Done"; patch.ngWork = "Done"; patch.jobCompletedAt = nowIso;
    const c = customers.find(c=>c.id===customerId);
    if(c && c.telecallerId){
      const now = new Date().toISOString();
      if(c.track === "crm_maintenance" && !c.taskResolvedAt){ patch.taskResolvedAt = now; patch.taskResolvedBy = c.telecallerId; }
      else if(c.track === "new_connection" && !c.formPickedUpAt){ patch.formPickedUpAt = now; patch.formPickedUpBy = c.telecallerId; }
    }
  }
  await saveJobField(customerId, patch);
  renderMain();
}

const SEED_CUSTOMERS = []; // demo customers removed — real customers load via REAL_CUSTOMERS (one-time import in initDb)

/* ============ LOGIN ============ */
let loginRole = "technician";
function selectLoginRole(role){
  loginRole = role;
  document.querySelectorAll(".role-tab").forEach(el=>el.classList.toggle("active", el.dataset.role===role));
  document.getElementById("loginDemoHint").textContent = t(ROLE_HINT_KEY[role] || "hint_technician");
  document.getElementById("loginError").classList.add("hidden");
}

let db = null;
let dbReady = false;
let currentUser = null; // {username, role, name}
let allUsers = [];
let inventory = [];
let issues = [];
let consumption = [];
let submissions = [];
let customers = [];
let tasks = [];
let attendance = [];
let safetyChecks = [];
let payoutRates = {crmRate: 50, formRate: 100};
let capConfig = {};            // saved Capitalisation settings (Firestore settings/capitalisation)
let capDraft = {rates:{}, manual:{}, header:{}}; // unsaved edits on the Capitalisation screen
let telecallerPayoutFilter = {start:"", end:""};
let telecallerSearchResults = [];
let telecallerHasSearched = false;
let telecallerSelectedCustomerId = null;

async function doLogin(){
  const user = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginPass").value.trim();
  const errorEl = document.getElementById("loginError");
  errorEl.classList.add("hidden");

  if(!db){ await initDb(); }

  let found = null;
  if(db){
    try{
      const snap = await db.collection("users").where("username","==",user).get();
      found = snap.docs.map(d=>({id:d.id, ...d.data()})).find(u=>u.password===pass && u.role===loginRole);
    }catch(e){ console.error(e); }
  } else {
    found = SEED_USERS.find(u=>u.username===user && u.password===pass && u.role===loginRole);
  }

  if(!found){
    errorEl.textContent = t("login_error");
    errorEl.classList.remove("hidden");
    return;
  }
  if(found.active === false){
    errorEl.textContent = "Ye login access remove kar diya gaya hai. Admin se sampark karein.";
    errorEl.classList.remove("hidden");
    return;
  }
  currentUser = {username: found.username, role: found.role, name: found.name};
  try{ localStorage.setItem("png_user", JSON.stringify(currentUser)); }catch(e){}
  showApp();
}

function doLogout(){

/* ============ DATABASE INIT (Firebase Firestore, independent of claude.ai) ============ */
async function initDb(){
  try{
    if(firebaseConfig.apiKey === "PASTE_YOUR_API_KEY_HERE"){
      throw new Error("Firebase config not filled in yet");
    }
    if(!window.firebase){
      await loadScriptOnce("https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js");
      await loadScriptOnce("https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js");
      await loadScriptOnce("https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js");
    }
    if(!firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
    await firebase.auth().signInAnonymously(); // silent — lets Firestore Security Rules require "signed in", no UI shown
    db = firebase.firestore();
  }catch(e){ console.error("Firebase init error", e); db = null; }
  if(!db){ updateDbBadge(false); return; }
  updateDbBadge(true);

  try{
    // Per-user check (not "collection empty") — so a seed user added later (e.g. a new role)
    // still gets created even though the database was already seeded earlier, and existing
    // users' current data (e.g. an admin-changed password) is never touched/overwritten.
    for(const u of SEED_USERS){
      const uSnap = await db.collection("users").doc(u.username).get();
      if(!uSnap.exists){ await db.collection("users").doc(u.username).set(u); }
    }
  }catch(e){ console.error("seed users error", e); }
  try{
    const snap = await db.collection("inventory").get();
    if(snap.empty){ for(const it of SEED_INVENTORY){ await db.collection("inventory").add(it); } }
  }catch(e){ console.error("seed inventory error", e); }
  try{
    const snap = await db.collection("issues").get();
    if(snap.empty){ for(const it of SEED_ISSUES){ await db.collection("issues").add(it); } }
  }catch(e){ console.error("seed issues error", e); }
  try{
    // One-time import of the real M/S TEJASAV customer list (flag doc stops it from re-running,
    // so customers an admin later deletes/edits are never re-created or overwritten).
    const flag = await db.doc("settings/tejasavImport").get();
    if(!flag.exists){
      const existing = await db.collection("customers").get();
      const ids = new Set(existing.docs.map(d=>d.id));
      const DEMO = {"5000090001":"Rahul Sharma","5000090002":"Priya Verma","98273822":"Amit Kumar","98273955":"Sunita Devi"};
      for(const d of existing.docs){
        const c = d.data();
        if(!c.source && DEMO[c.bpNo] === c.name){ await db.doc("customers/"+d.id).delete(); }
      }
      for(const c of REAL_CUSTOMERS){
        if(!ids.has(c.id)){ await db.doc("customers/"+c.id).set(c); }
      }
      await db.doc("settings/tejasavImport").set({done:true, count:REAL_CUSTOMERS.length, at:new Date().toISOString()});
    }
  }catch(e){ console.error("real customer import error", e); }
  try{
    // small follow-up migration: SL sheet row (needed by Capitalisation) for customers imported earlier
    const flag2 = await db.doc("settings/tejasavImport2").get();
    if(!flag2.exists){
      for(const c of REAL_CUSTOMERS){
        if(!c.slRow) continue;
        const ref = db.doc("customers/"+c.id); const cur = await ref.get();
        if(cur.exists && !cur.data().slRow){ await ref.update({slRow:c.slRow}); }
      }
      await db.doc("settings/tejasavImport2").set({done:true});
    }
  }catch(e){ console.error("slRow migration error", e); }
  try{
    const flag3 = await db.doc("settings/tejasavImport3").get();
    if(!flag3.exists){
      for(const c of REAL_CUSTOMERS){
        if(c.status !== "completed") continue;
        const ref = db.doc("customers/"+c.id); const cur = await ref.get();
        if(cur.exists && cur.data().status === "pending" && !cur.data().assignedTechnician){ await ref.update({status:"completed"}); }
      }
      await db.doc("settings/tejasavImport3").set({done:true});
    }
  }catch(e){ console.error("status migration error", e); }
  try{
    const snap = await db.doc("settings/payoutRates").get();
    if(!snap.exists){ await db.doc("settings/payoutRates").set(payoutRates); }
  }catch(e){ console.error("seed payout rates error", e); }

  db.collection("users").onSnapshot(snap=>{ allUsers = snap.docs.map(d=>({id:d.id, ...d.data()})); renderMain(); }, e=>console.error(e));
  db.collection("inventory").onSnapshot(snap=>{ inventory = snap.docs.map(d=>({id:d.id, ...d.data()})); renderMain(); }, e=>console.error(e));
  db.collection("issues").onSnapshot(snap=>{ issues = snap.docs.map(d=>({id:d.id, ...d.data()})); renderMain(); }, e=>console.error(e));
  db.collection("consumption").onSnapshot(snap=>{ consumption = snap.docs.map(d=>({id:d.id, ...d.data()})); renderMain(); }, e=>console.error(e));
  db.collection("submissions").onSnapshot(snap=>{ submissions = snap.docs.map(d=>({id:d.id, ...d.data()})); renderMain(); }, e=>console.error(e));
  db.collection("customers").onSnapshot(snap=>{ customers = snap.docs.map(d=>({id:d.id, ...d.data()})); renderMain(); }, e=>console.error(e));
  db.collection("attendance").onSnapshot(snap=>{ attendance = snap.docs.map(d=>({id:d.id, ...d.data()})); renderMain(); }, e=>console.error(e));
  db.collection("safety_checks").onSnapshot(snap=>{ safetyChecks = snap.docs.map(d=>({id:d.id, ...d.data()})); renderMain(); }, e=>console.error(e));
  db.doc("settings/capitalisation").onSnapshot(snap=>{ if(snap && snap.exists) capConfig = snap.data(); renderMain(); }, e=>console.error(e));
  db.doc("settings/payoutRates").onSnapshot(snap=>{ if(snap && snap.exists) payoutRates = {crmRate:50, formRate:100, ...snap.data()}; renderMain(); }, e=>console.error(e));
  dbReady = true;
}

/* ============ CALL / WHATSAPP HELPERS ============ */
function waDigits(phone){
  const raw = String(phone||"");
  if(raw.includes("*")) return ""; // masked number (e.g. 701584****) — not callable
  let d = raw.replace(/\D/g,"");
  if(d.length === 10) d = "91"+d;
  else if(d.length === 11 && d.startsWith("0")) d = "91"+d.slice(1);
  // only a complete number is usable: 91 + 10 digits (India), or an explicit +country-code number
  if(d.length === 12 && d.startsWith("91")) return d;
  if(raw.trim().startsWith("+") && d.length >= 11 && d.length <= 15) return d;
  return "";
}
function waLink(phone, message){
  const d = waDigits(phone);
  if(!d) return "";
  return `https://wa.me/${d}?text=${encodeURIComponent(message||"")}`;
}
function callLink(phone){
  const d = waDigits(phone);
  if(!d) return "";
  return `tel:+${d}`;
}
function openWaFromBox(phone, boxId){
  const box = document.getElementById(boxId);
  const msg = box ? box.value : "";
  const link = waLink(phone, msg);
  if(!link){ alert("Phone number sahi nahi hai."); return; }
  window.open(link, "_blank");
}

function formatWorkDateForMessage(dateStr, plain){
  if(!dateStr) return "";
  const d = new Date(dateStr+"T00:00:00");
  if(isNaN(d)) return dateStr;
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  const dOnly = new Date(d); dOnly.setHours(0,0,0,0);
  const formatted = d.toLocaleDateString("en-IN", {day:"numeric", month:"long", year:"numeric"});
  if(plain) return formatted;
  if(dOnly.getTime() === tomorrow.getTime()) return `Kal (${formatted})`;
  if(dOnly.getTime() === today.getTime()) return `Aaj (${formatted})`;
  return formatted;
}

/* ============ ATTENDANCE (geotagged login) ============ */
async function reverseGeocode(lat, lng){
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 6000);
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16&addressdetails=0`, {signal: controller.signal, headers:{"Accept":"application/json"}});
    clearTimeout(timer);
    if(!res.ok) return null;
    const j = await res.json();
    return j.display_name || null;
  }catch(e){ return null; } // best-effort only — coordinates are shown either way
}
async function markAttendanceIfNeeded(){
  if(!currentUser) return;
  try{
    const today = new Date().toISOString().slice(0,10);
    if(db){
      const snap = await db.collection("attendance").where("username","==",currentUser.username).get();
      const already = snap.docs.some(d=>(d.data().loginAt||"").slice(0,10)===today);
      if(already) return;
    } else {
      const already = attendance.some(a=>a.username===currentUser.username && (a.loginAt||"").slice(0,10)===today);
      if(already) return;
    }
    const geo = await getGeoTag();
    const address = geo ? await reverseGeocode(geo.lat, geo.lng) : null;
    const record = { username: currentUser.username, name: currentUser.name, role: currentUser.role, geotag: geo, address, loginAt: new Date().toISOString() };
    if(db){ await db.collection("attendance").add(record); }
    else { attendance.push({id:"local_"+Date.now(), ...record}); }
  }catch(e){ console.error("attendance error", e); }
}

   Camera-only capture (no gallery/file attach) via the HTML "capture" attribute — this reliably opens
   the device camera directly on Android Chrome; some desktop browsers may not honour it the same way. */
let safetyPhotoDraft = {selfie:null, body:null};

function hasSafetyCheckToday(username){

function fileToResizedDataURL(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = ()=>reject(new Error("Could not read image"));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });
}
// Shrinks the photo (dimensions + JPEG quality) until it comfortably fits inside a database document
async function captureCompressedPhoto(file){
  let maxDim = 640, quality = 0.7;
  let dataUrl = await fileToResizedDataURL(file, maxDim, quality);
  for(let attempt=0; attempt<5 && dataUrl.length*0.75 > 70000; attempt++){
    quality = Math.max(0.3, quality - 0.15);
    maxDim = Math.max(240, Math.round(maxDim * 0.8));
    dataUrl = await fileToResizedDataURL(file, maxDim, quality);
  }
  return dataUrl;
}

/* ============ EMPLOYEE CREATION HELPERS ============ */
function generateUsername(name){
  const base = (name||"user").trim().toLowerCase().replace(/[^a-z]/g,"").slice(0,10) || "user";
  const existing = new Set((allUsers.length?allUsers:SEED_USERS).map(u=>u.username));
  let uname = base, i = 1;
  while(existing.has(uname)){ uname = base + (i++); }
  return uname;
}
function generatePassword(name){
  const raw = (name||"User").trim().slice(0,4) || "User";
  const cap = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
  const symbols = ["@","#","$","!","%"];
  const sym = symbols[Math.floor(Math.random()*symbols.length)];
  const digits = Math.floor(1000 + Math.random()*9000);
  return `${cap}${sym}${digits}`;
}

function getTechBalances(username){
  const issuedMap = {};
  issues.filter(i=>i.technicianUsername===username).forEach(i=>{
    issuedMap[i.itemName] = issuedMap[i.itemName] || {issued:0, unit:i.unit||"Nos"};
    issuedMap[i.itemName].issued += Number(i.qty)||0;
  });
  consumption.filter(c=>c.technicianUsername===username).forEach(c=>{
    issuedMap[c.itemName] = issuedMap[c.itemName] || {issued:0, unit:c.unit||"Nos"};
    issuedMap[c.itemName].consumed = (issuedMap[c.itemName].consumed||0) + (Number(c.qty)||0);
  });
  return Object.keys(issuedMap).map(name=>({
    itemName:name, unit:issuedMap[name].unit,
    issued: issuedMap[name].issued||0,
    consumed: issuedMap[name].consumed||0,
    balance: (issuedMap[name].issued||0) - (issuedMap[name].consumed||0)
  }));
}

function renderJobWizardStage(c){
  const stage = jobStageOf(c);
  if(stage==="done") return renderWizDone(c);
  if(stage==="forms") return renderWizForms(c);
  if(stage==="material") return renderWizMaterial(c);
  if(stage==="testing") return renderWizTesting(c);
  if(stage==="working") return renderWizWorking(c);
  if(stage==="meterphoto") return renderWizMeterPhoto(c);

async function checkWizArrival(customerId){
  const statusEl = document.getElementById("wizArrivalStatus");
  if(statusEl) statusEl.textContent = "📍 Location capture ho rahi hai...";
  const geo = await getGeoTag();
  const c = customers.find(c=>c.id===customerId);
  if(!geo){
    if(statusEl) statusEl.innerHTML = `<span class="text-red-600">⚠️ Location nahi mil payi. GPS/permission check karein aur dobara try karein.</span>`;
    return;
  }
  if(c && c.geotag){
    const dist = distanceMeters(geo.lat, geo.lng, c.geotag.lat, c.geotag.lng);
    geo.distanceM = Math.round(dist);
    if(dist > GEOFENCE_RADIUS_M){
      if(statusEl) statusEl.innerHTML = `<span class="text-red-600 font-bold">❌ Aap survey location se ${Math.round(dist)}m dur hain. ${GEOFENCE_RADIUS_M}m ke andar aakar dobara check karein.</span>`;
      return;
    }
    if(statusEl) statusEl.innerHTML = `<span class="text-green-600 font-bold">✅ Location match ho gayi (${Math.round(dist)}m). Aage badh rahe hain...</span>`;
  } else if(statusEl){
    statusEl.innerHTML = `<span class="text-green-600 font-bold">✅ Location capture ho gayi.</span>`;
  }
  await saveJobField(customerId, {wizArrivalGeo: geo});
  await advanceJobStage(customerId, "arrival");
}

async function completeWizVerify(customerId){
  const make = document.getElementById("wizMeterMake").value.trim();
  const type = document.getElementById("wizMeterType").value;
  const number = document.getElementById("wizMeterNumber").value.trim();
  const contactNumber = document.getElementById("wizContactNumber").value.trim();
  const fittingOk = document.getElementById("wizFittingOk").value;
  const fittingDetailsEl = document.getElementById("wizFittingDetails");
  const fittingDetails = fittingDetailsEl ? fittingDetailsEl.value.trim() : "";
  const callVerified = document.getElementById("wizCallVerified").value;
  if(!callVerified){ alert("Kripya batayein ki call par batayi gayi detail sahi hai ya nahi."); return; }

  let mismatchNote = "", mismatchPhoto = null;
  const existing = customers.find(c=>c.id===customerId);
  if(callVerified === "No"){
    const noteEl = document.getElementById("wizMismatchNote");
    mismatchNote = noteEl ? noteEl.value.trim() : "";
    const photoInput = document.getElementById("wizMismatchPhotoInput");
    mismatchPhoto = (photoInput && photoInput.dataset.captured) || (existing && existing.wizMeter && existing.wizMeter.mismatchPhoto) || null;
    if(!mismatchPhoto){ alert("Mismatch ka photo lena zaroori hai."); return; }
  }

  const checkboxes = document.querySelectorAll(".wizMissingChk");
  const missingItems = [];
  let missingIdx = 0;
  for(let i=0;i<checkboxes.length;i++){
    const chk = checkboxes[i];
    if(!chk.checked) continue;
    const photoInput = document.getElementById("wizMissingPhotoInput_"+missingIdx);
    let photo = (photoInput && photoInput.dataset.captured) || null;
    if(!photo && existing && existing.wizMeter && existing.wizMeter.missingItems){
      const prev = existing.wizMeter.missingItems.find(m=>m.itemName===chk.value);
      if(prev) photo = prev.photo;
    }
    if(!photo){ alert(`"${chk.value}" ka photo lena zaroori hai.`); return; }
    missingItems.push({itemName: chk.value, photo});
    missingIdx++;
  }
  const missingNoteEl = document.getElementById("wizMissingNote");
  const missingNote = missingNoteEl ? missingNoteEl.value.trim() : "";
  if(missingItems.length && missingNote){ missingItems.forEach(m=>m.note = missingNote); }

  const wizMeter = {make, type, number, contactNumber, fittingOk, fittingDetails, callVerified, mismatchNote, mismatchPhoto, missingItems, isOldConnectionCase: missingItems.length>0};
  await saveJobField(customerId, {wizMeter});
  await advanceJobStage(customerId, "verify");
}

  </div>`;

async function saveWizMaterial(customerId){
  const bal = getTechBalances(currentUser.username).filter(b=>b.balance>0);
  const item = bal[materialStepIndex];
  const qtyEl = document.getElementById("wizMatQty");
  const qty = parseFloat(qtyEl.value);
  if(item && qty > 0){
    const c = customers.find(c=>c.id===customerId);
    const used = ((c && c.wizMaterialUsed) || []).concat([{itemName:item.itemName, qty:qty, unit:item.unit}]);
    await saveJobField(customerId, {wizMaterialUsed: used});
  }
  materialStepIndex++;
  renderMain();
}
function skipWizMaterial(customerId){ materialStepIndex++; renderMain(); }
function addWizAddonRow(){
  const bal = getTechBalances(currentUser.username).filter(b=>b.balance>0);
  const container = document.getElementById("wizAddonRows");
  if(!container) return;
  const rid = "wao_"+(addonRowCount++);
  const opts = bal.map(b=>`<option value="${b.itemName}" data-unit="${b.unit}">${b.itemName} (${b.balance} ${b.unit} left)</option>`).join("");
  const row = document.createElement("div");
  row.id = rid;
  row.className = "flex gap-2 items-center";
  row.innerHTML = `<select class="ff-input flex-1 wao-item">${opts}</select>
    <input type="number" class="ff-input w-24 wao-qty" placeholder="Qty">
    <button type="button" onclick="document.getElementById('${rid}').remove()" class="text-red-500 font-bold px-2">✕</button>`;
  container.appendChild(row);
}
async function completeWizMaterial(customerId){
  const rows = document.querySelectorAll("#wizAddonRows > div");
  const c = customers.find(c=>c.id===customerId);
  let used = (c && c.wizMaterialUsed) || [];
  for(let i=0;i<rows.length;i++){
    const r = rows[i];
    const sel = r.querySelector(".wao-item");
    const qtyEl = r.querySelector(".wao-qty");
    if(!sel || !qtyEl) continue;
    const qty = parseFloat(qtyEl.value);
    if(sel.value && qty>0){
      const opt = sel.selectedOptions && sel.selectedOptions[0];
      used = used.concat([{itemName: sel.value, qty:qty, unit: (opt && opt.dataset.unit) || "Nos"}]);
    }
  }
  await saveJobField(customerId, {wizMaterialUsed: used});
  materialStepIndex = 0;
  await saveJobField(customerId, {jobStage: "forms"});
  autoOpenNgFormFromWizard(customerId);
}
function autoOpenNgFormFromWizard(customerId){
  openFormEntry("conversion_report", customerId).then(function(){
    setTimeout(function(){
      const c = customers.find(c=>c.id===customerId);
      const used = (c && c.wizMaterialUsed) || [];
      used.forEach(function(m){
        addMaterialUsedRow();
        const rows = document.querySelectorAll("#materialUsedRows > div");
        const last = rows[rows.length-1];
        if(last){
          const sel = last.querySelector(".mu-item");
          const qtyEl = last.querySelector(".mu-qty");
          if(sel) sel.value = m.itemName;
          if(qtyEl) qtyEl.value = m.qty;
        }
      });
      showToast("Material entries NG form me bhar di gayi hain — check karke Save karein.");
    }, 80);
  });
}

function renderFieldHTML(formId, field){
  const id = fieldInputId(formId, field.key);
  const val = field.def || "";
  if(field.type==="signature"){
    return `<div><label class="ff-label">${field.label}</label>
      <canvas id="${id}" width="500" height="120" class="border rounded w-full touch-none" style="background:#fff;"></canvas>
      <button type="button" onclick="clearSignature('${id}')" class="mt-1 text-xs bg-gray-100 px-2 py-1 rounded font-bold">Clear Signature</button>
    </div>`;
  }
  if(field.type==="textarea"){
    return `<div><label class="ff-label">${field.label}</label><textarea id="${id}" class="ff-input-line" rows="2">${val}</textarea></div>`;
  }
  if(field.type==="date"){
    return `<div><label class="ff-label">${field.label}</label><input id="${id}" type="date" class="ff-input-line" value="${val}"></div>`;
  }
  if(field.type==="select"){
    const opts = (field.options||[]).map(o=>`<option value="${o}">${o}</option>`).join("");
    return `<div><label class="ff-label">${field.label}</label><select id="${id}" class="ff-input-line"><option value="">-- Select --</option>${opts}</select></div>`;
  }
  return `<div><label class="ff-label">${field.label}</label><input id="${id}" type="text" class="ff-input-line" value="${val}"></div>`;
}

function renderTableEntryHTML(formId, table){
  const rows = [];
  for(let r=0;r<table.rows;r++){
    const prefillRow = (table.prefill && table.prefill[r]) || {};
    rows.push(`<tr>${table.columns.map((col,c)=>{
      const pv = prefillRow[col] || "";
      return `<td><input id="${tableCellId(formId,table.key,r,c)}" type="text" value="${pv}"></td>`;
    }).join("")}</tr>`);
  }
  return `<div class="bg-white rounded-lg shadow p-3">
    <h3 class="font-bold text-sm text-gray-800 mb-2">${table.heading}</h3>
    <div class="overflow-x-auto">
      <table class="ff-table">
        <thead><tr>${table.columns.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>
  </div>`;
}

function getGeoTag(){
  return new Promise((resolve)=>{
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy, capturedAt:new Date().toISOString()}),
      err=>{ console.warn("geo error", err); resolve(null); },
      {enableHighAccuracy:true, timeout:10000}
    );
  });
}

/* ============ SKETCH + SIGNATURE (isometric graph tool + signature pads) ============ */
function drawIsoGrid(ctx,w,h,size){
  ctx.save();
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = "#d7dde3";
  ctx.lineWidth = 1;
  for(let x=0;x<=w;x+=size){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  const slope = Math.tan(Math.PI/6); // 30 degrees, standard isometric angle
  const span = h/slope;
  const startOffset = -Math.ceil(span/size)*size;
  for(let offset=startOffset; offset<=w+span; offset+=size){
    ctx.beginPath(); ctx.moveTo(offset,0); ctx.lineTo(offset+span,h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(offset,0); ctx.lineTo(offset-span,h); ctx.stroke();
  }
  ctx.restore();
}

function initSketchCanvas(){
  const canvas = document.getElementById("sketchCanvas");
  if(!canvas) return;
  sketchCtx = canvas.getContext("2d");
  drawIsoGrid(sketchCtx, canvas.width, canvas.height, 20);
  sketchBase = sketchCtx.getImageData(0,0,canvas.width,canvas.height);
  sketchCtx.lineWidth = 2.5;
  sketchCtx.lineCap = "round";
  sketchCtx.lineJoin = "round";

  const getPos = (e)=>{
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x: cx * (canvas.width/rect.width), y: cy * (canvas.height/rect.height)};
  };

  const start = (e)=>{
    e.preventDefault();
    const p = getPos(e);
    if(sketchTool === "text"){
      const txt = prompt("Enter text:");
      if(txt){
        sketchCtx.fillStyle = sketchColor;
        sketchCtx.font = "bold 16px Arial";
        sketchCtx.fillText(txt, p.x, p.y);
        sketchBase = sketchCtx.getImageData(0,0,canvas.width,canvas.height);
      }
      return;
    }
    sketching = true;
    sketchStart = p;
    sketchBase = sketchCtx.getImageData(0,0,canvas.width,canvas.height);
    if(sketchTool === "pen"){
      sketchCtx.strokeStyle = sketchColor;
      sketchCtx.beginPath();
      sketchCtx.moveTo(p.x,p.y);
    }
  };
  const move = (e)=>{
    if(!sketching) return;
    e.preventDefault();
    const p = getPos(e);
    if(sketchTool === "pen"){
      sketchCtx.lineTo(p.x,p.y);
      sketchCtx.stroke();
    } else if(sketchTool === "line" || sketchTool === "box"){
      sketchCtx.putImageData(sketchBase,0,0);
      sketchCtx.strokeStyle = sketchColor;
      sketchCtx.beginPath();
      if(sketchTool === "line"){
        sketchCtx.moveTo(sketchStart.x, sketchStart.y);
        sketchCtx.lineTo(p.x, p.y);
      } else {
        sketchCtx.rect(Math.min(sketchStart.x,p.x), Math.min(sketchStart.y,p.y), Math.abs(p.x-sketchStart.x), Math.abs(p.y-sketchStart.y));
      }
      sketchCtx.stroke();
    }
  };
  const end = ()=>{
    if(!sketching) return;
    sketching = false;
    sketchBase = sketchCtx.getImageData(0,0,canvas.width,canvas.height);
  };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}

function setSketchTool(tool){
  sketchTool = tool;
  document.querySelectorAll(".sketch-tool-btn").forEach(b=>{
    const active = b.dataset.tool===tool;
    b.classList.toggle("bg-[#0D904F]", active);
    b.classList.toggle("text-white", active);
    b.classList.toggle("bg-gray-100", !active);
  });
}
function setSketchColor(color){ sketchColor = color; }
function clearSketch(){
  const canvas = document.getElementById("sketchCanvas");
  if(!canvas || !sketchCtx) return;
  drawIsoGrid(sketchCtx, canvas.width, canvas.height, 20);
  sketchBase = sketchCtx.getImageData(0,0,canvas.width,canvas.height);
}

/* ===== Signature pad (reusable for any signature-type field) ===== */
function initSignaturePad(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = "#111111"; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  let drawing = false;
  const getPos = (e)=>{
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x: cx * (canvas.width/rect.width), y: cy * (canvas.height/rect.height)};
  };
  const start = (e)=>{ drawing=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
  const move = (e)=>{ if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
  const end = ()=>{ drawing=false; };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}
function clearSignature(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height);
}

function collectCurrentFormData(){
  const form = FORMS[currentFormId];
  const data = {sections:{}, tables:{}};
  form.sections.forEach(sec=>{
    sec.fields.forEach(f=>{
      if(f.type==="signature"){
        const canvas = document.getElementById(fieldInputId(currentFormId, f.key));
        data.sections[f.key] = canvas ? canvas.toDataURL("image/png") : "";
      } else {
        const elx = document.getElementById(fieldInputId(currentFormId, f.key));
        data.sections[f.key] = elx ? elx.value : "";
      }
    });
  });
  (form.tables||[]).forEach(t=>{
    const rows = [];
    for(let r=0;r<t.rows;r++){
      const row = {};
      t.columns.forEach((col,c)=>{
        const elx = document.getElementById(tableCellId(currentFormId, t.key, r, c));
        row[col] = elx ? elx.value : "";
      });
      rows.push(row);
    }
    data.tables[t.key] = rows;
  });
  if(form.hasSketch){
    const canvas = document.getElementById("sketchCanvas");
    data.sketch = canvas ? canvas.toDataURL("image/png") : null;
  }
  return data;
}

function collectMaterialUsed(){
  const rows = document.querySelectorAll("#materialUsedRows > div");
  const used = [];
  rows.forEach(r=>{
    const sel = r.querySelector(".mu-item");
    const qtyEl = r.querySelector(".mu-qty");

    const qty = parseFloat(qtyEl.value);
    if(sel.value && qty > 0){
      used.push({itemName: sel.value, qty, unit: sel.selectedOptions[0]?.dataset.unit || "Nos"});

      }

  (form.tables||[]).forEach(t=>{

}

async function saveCurrentForm(){
  const data = collectCurrentFormData();
  const materialUsed = collectMaterialUsed();

  // validate against balances
  const bal = getTechBalances(currentUser.username);
  for(const m of materialUsed){
    const b = bal.find(x=>x.itemName===m.itemName);
    if(!b || m.qty > b.balance){
      alert(`Not enough balance for ${m.itemName}. Available: ${b?b.balance:0}`);
      return;
    }
  }

  const record = {
    formType: currentFormId,
    data,
    technicianUsername: currentUser.username,
    customerId: currentCustomerId || null,
    geotag: currentGeotag || null,
    materialUsed,
    createdAt: new Date().toISOString()
  };

  const paperField = FORM_TO_PAPER_FIELD[currentFormId];

  if(db){
    try{
      const ref = await db.collection("submissions").add(record);
      for(const m of materialUsed){
        await db.collection("consumption").add({
          technicianUsername: currentUser.username, itemName: m.itemName, qty: m.qty, unit: m.unit,
          consumedAt: new Date().toISOString(), submissionId: ref.id
        });
      }
      if(currentCustomerId && paperField){
        await db.doc("customers/"+currentCustomerId).update({ [paperField]: "Done" });
      }
      showToast("Saved! Form, material aur paper-status sync ho gaya.");
      if(currentCustomerId){ openCustomerDetail(currentCustomerId); } else { setView("myjobs"); }
    }catch(e){
      console.error(e);
      alert("Could not save. Check connection and try again.");
    }
  } else {
    record.id = "local_"+Date.now();
    submissions.push(record);
    materialUsed.forEach(m=>consumption.push({id:"local_"+Date.now()+Math.random(), technicianUsername:currentUser.username, itemName:m.itemName, qty:m.qty, unit:m.unit, consumedAt:new Date().toISOString()}));
    if(currentCustomerId && paperField){
      const c = customers.find(c=>c.id===currentCustomerId);
      if(c) c[paperField] = "Done";
    }
    showToast("Saved locally (no live database connected).");
    if(currentCustomerId){ openCustomerDetail(currentCustomerId); } else { setView("myjobs"); }
  }
}

function buildPrintHTML(formId, record){
  const form = FORMS[formId];
  const data = record.data || record; // support raw data too
  let rowsHtml = "";
  form.sections.forEach(sec=>{
    rowsHtml += `<tr><td colspan="2" style="background:#e5f4ec;font-weight:bold;padding:6px 8px;border:1px solid #999;">${sec.heading||form.title}</td></tr>`;
    sec.fields.forEach(f=>{
      const v = (data.sections && data.sections[f.key]) || "";
      if(f.type==="signature"){
        rowsHtml += `<tr><td style="width:35%;font-weight:bold;padding:5px 8px;border:1px solid #999;">${f.label}</td><td style="padding:5px 8px;border:1px solid #999;">${v ? `<img src="${v}" style="height:45px;">` : ""}</td></tr>`;
      } else {
        rowsHtml += `<tr><td style="width:35%;font-weight:bold;padding:5px 8px;border:1px solid #999;">${f.label}</td><td style="padding:5px 8px;border:1px solid #999;">${v}</td></tr>`;
      }
    });
  });

  let tablesHtml = "";
  (form.tables||[]).forEach(t=>{
    const rows = (data.tables && data.tables[t.key]) || [];
    tablesHtml += `<div style="margin-top:14px;font-weight:bold;">${t.heading}</div>
      <table style="width:100%;border-collapse:collapse;margin-top:4px;font-size:11px;">
        <thead><tr>${t.columns.map(c=>`<th style="border:1px solid #999;background:#e5f4ec;padding:4px;">${c}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r=>`<tr>${t.columns.map(c=>`<td style="border:1px solid #999;padding:4px;text-align:center;">${r[c]||""}</td>`).join("")}</tr>`).join("")}</tbody>
      </table>`;
  });

  let sketchHtml = "";
  if(form.hasSketch && data.sketch){
    sketchHtml = `<div style="margin-top:14px;font-weight:bold;">Isometric Sketch</div>
      <img src="${data.sketch}" style="width:100%;border:1px solid #999;margin-top:4px;">`;
  }

  let metaHtml = "";
  if(record.technicianUsername || record.geotag || (record.materialUsed && record.materialUsed.length)){
    metaHtml += `<div style="margin-top:14px;font-weight:bold;">Job Metadata</div>
      <table style="width:100%;border-collapse:collapse;margin-top:4px;font-size:11px;">
        <tr><td style="border:1px solid #999;padding:4px;font-weight:bold;width:30%;">Filled By</td><td style="border:1px solid #999;padding:4px;">${techName(record.technicianUsername||"")}</td></tr>
        <tr><td style="border:1px solid #999;padding:4px;font-weight:bold;">GPS Location</td><td style="border:1px solid #999;padding:4px;">${record.geotag ? `${record.geotag.lat.toFixed(6)}, ${record.geotag.lng.toFixed(6)} (±${Math.round(record.geotag.accuracy)}m)` : "Not captured"}</td></tr>
      </table>`;
    if(record.materialUsed && record.materialUsed.length){
      metaHtml += `<div style="margin-top:8px;font-weight:bold;">Material Consumed</div>
        <table style="width:100%;border-collapse:collapse;margin-top:4px;font-size:11px;">
          <thead><tr><th style="border:1px solid #999;background:#e5f4ec;padding:4px;">Item</th><th style="border:1px solid #999;background:#e5f4ec;padding:4px;">Qty</th></tr></thead>
          <tbody>${record.materialUsed.map(m=>`<tr><td style="border:1px solid #999;padding:4px;">${m.itemName}</td><td style="border:1px solid #999;padding:4px;text-align:center;">${m.qty} ${m.unit||""}</td></tr>`).join("")}</tbody>
        </table>`;
    }
  }

  return `<div style="width:754px;padding:20px;font-family:Arial,sans-serif;color:#111;">
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px;">
      <tr>
        <td style="width:22%;border:1px solid #999;text-align:center;padding:10px;font-weight:bold;color:#0D904F;">Resonance<br>Energy</td>
        <td style="width:56%;border:1px solid #999;text-align:center;padding:10px;font-size:18px;font-weight:bold;">${form.title.toUpperCase()}</td>
        <td style="width:22%;border:1px solid #999;text-align:center;padding:10px;font-weight:bold;color:#0D904F;">GAIL<br>gas</td>
      </tr>
    </table>
    <table style="width:100%;border-collapse:collapse;">${rowsHtml}</table>
    ${tablesHtml}
    ${sketchHtml}
    ${metaHtml}
    <div style="margin-top:30px;display:flex;justify-content:space-between;font-size:12px;">
      <div>Contractor</div><div>Consumer Sign.</div><div>REPL/GGL</div>
    </div>
  </div>`;
}

async function renderToPdf(formId, record, filename){
  let loadingToast = showToast("Preparing PDF, please wait...");
  try{ await ensurePdfLibs(); }
  catch(e){ hideToast(loadingToast); alert("Could not load PDF engine. Check internet connection."); return; }
  const host = document.getElementById("printHost");
  host.innerHTML = buildPrintHTML(formId, record);
  await new Promise(r=>setTimeout(r, 60));
  const target = host.firstElementChild;
  const canvas = await html2canvas(target, {scale:2, backgroundColor:"#ffffff"});
  const imgData = canvas.toDataURL("image/png");
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p","mm","a4");
  const pageWidth = 210, pageHeight = 297;
  const imgW = pageWidth;
  const imgH = (canvas.height * imgW) / canvas.width;
  let heightLeft = imgH, position = 0;
  pdf.addImage(imgData, "PNG", 0, position, imgW, imgH);
  heightLeft -= pageHeight;
  while(heightLeft > 0){
    position = heightLeft - imgH;
    pdf.addPage();
    pdf.addImage(imgData, "PNG", 0, position, imgW, imgH);
    heightLeft -= pageHeight;
  }
  pdf.save(filename);
  host.innerHTML = "";
  hideToast(loadingToast);
}

function showPrintPreview(html, downloadFn){
  const overlay = document.createElement("div");
  overlay.id = "printPreviewOverlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:9999;display:flex;flex-direction:column;";
  overlay.innerHTML = `
    <div style="background:#0D904F;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <span style="font-weight:bold;">📄 Form Layout Preview</span>
      <div style="display:flex;gap:8px;">
        ${downloadFn ? `<button id="previewDownloadBtn" style="background:#8430CE;border:none;color:#fff;padding:6px 12px;border-radius:6px;font-weight:bold;font-size:12px;">⬇ Download PDF</button>` : ""}
        <button id="closePreviewBtn" style="background:rgba(255,255,255,0.2);border:none;color:#fff;padding:6px 12px;border-radius:6px;font-weight:bold;font-size:12px;">✕ Close</button>
      </div>
    </div>
    <div style="flex:1;overflow:auto;background:#d1d5db;padding:16px 0;">
      <div id="previewScaleWrap" style="transform-origin:top center;margin:0 auto;">${html}</div>
    </div>`;
  document.body.appendChild(overlay);

  const wrap = overlay.querySelector("#previewScaleWrap");
  const availWidth = Math.min(window.innerWidth - 24, 754);
  const scale = availWidth / 754;
  wrap.style.transform = `scale(${scale})`;
  wrap.style.width = "754px";
  wrap.parentElement.style.height = `${Math.ceil(wrap.scrollHeight * scale) + 20}px`;

  overlay.querySelector("#closePreviewBtn").onclick = ()=> overlay.remove();
  if(downloadFn){
    overlay.querySelector("#previewDownloadBtn").onclick = async ()=>{ await downloadFn(); };
  }
}

/* ---- Payout calculator ---- */
function computeTelecallerPayout(username, startDate, endDate){
  const inRange = (iso) => {
    if(!iso) return false;
    const d = iso.slice(0,10);
    if(startDate && d < startDate) return false;
    if(endDate && d > endDate) return false;
    return true;
  };
  const mine = customers.filter(c=>c.telecallerId===username);
  const crmClosures = mine.filter(c=>c.track==="crm_maintenance" && inRange(c.taskResolvedAt));
  const formPickups = mine.filter(c=>c.track==="new_connection" && inRange(c.formPickedUpAt));
  const crmAmount = crmClosures.length * (payoutRates.crmRate||0);
  const formAmount = formPickups.length * (payoutRates.formRate||0);
  return {crmCount: crmClosures.length, formCount: formPickups.length, crmAmount, formAmount, total: crmAmount+formAmount};
}
function renderTelecallerPayout(){
  const {start, end} = telecallerPayoutFilter;
  const result = computeTelecallerPayout(currentUser.username, start, end);
  return `<h2 class="font-bold text-gray-800 mb-3">${t("payout_title")}</h2>
    <div class="bg-white rounded-lg shadow p-4 mb-4">

        <p class="text-xs text-gray-400">${t("payout_crm_closures")}</p>
        <p class="text-2xl font-bold text-[#0D904F]">${result.crmCount}</p>
        <p class="text-xs text-gray-500">× ₹${payoutRates.crmRate} = ₹${result.crmAmount}</p>
      </div>

async function reassignCustomer(customerId){
  const sel = document.getElementById("reassignSel_"+customerId);
  const dateEl = document.getElementById("reassignDate_"+customerId);
  const techUsername = sel.value;
  if(!techUsername) return;
  const workDate = dateEl ? dateEl.value : "";
  const c = customers.find(c=>c.id===customerId);
  if(c && c.assignedTechnician===techUsername && !workDate){ showToast("Ye customer pehle se isi technician ko assigned hai."); return; }
  const updates = {assignedTechnician: techUsername, status:"assigned"};
  if(workDate) updates.scheduledWorkDate = workDate;
  if(db){
    try{ await db.doc("customers/"+customerId).update(updates); }
    catch(e){ console.error(e); alert("Transfer failed."); return; }
  } else {
    if(c){ Object.assign(c, updates); renderMain(); }
  }
  showToast(`Kaam transfer ho gaya: ${techName(techUsername)}`);
  showScheduleContactModal({...(c||{id:customerId}), ...updates}, techUsername, workDate);
}

async function adminAddEmployee(){

  const username = generateUsername(name);
  const password = generatePassword(name);
  const record = {username, password, role, name, active:true, createdAt:new Date().toISOString()};
  if(db){
    try{ await db.collection("users").doc(username).set(record); }
    catch(e){ console.error(e); alert("Add karne mein error aaya, dobara try karein."); return; }

async function toggleEmployeeActive(username){
  if(!currentUser || currentUser.role !== "admin") return;
  const u = employeeList().find(u=>u.username===username);
  if(!u) return;
  const newActive = !(u.active !== false);
  if(!newActive && !confirm(`${u.name} ka login access hata dein? Inka pura purana data (forms, customers, attendance) admin panel mein dikhta rahega.`)) return;
  if(db){
    try{ await db.doc("users/"+username).update({active:newActive}); }
    catch(e){ console.error(e); alert("Update failed."); return; }
  } else {

async function saveEmpPassword(username){
  if(!currentUser || currentUser.role !== "admin") return;
  const input = document.getElementById("pwUpdateInput_"+username);
  const newPass = input ? input.value.trim() : "";
  if(!newPass || newPass.length < 4){ alert("Kam se kam 4 character ka password dein."); return; }
  if(db){
    try{ await db.doc("users/"+username).update({password: newPass}); }
    catch(e){ console.error(e); alert("Password update nahi ho paya, dobara try karein."); return; }
  } else {
    const u = allUsers.find(u=>u.username===username);
    if(u) u.password = newPass;
  }
  const u2 = employeeList().find(u=>u.username===username);
  if(u2) u2.password = newPass;
  const curEl = document.getElementById("pwCurrentVal_"+username);
  if(curEl) curEl.textContent = newPass;
  closePwChangeBox(username);
  alert(`Password update ho gaya!\n\nUsername: ${username}\nNaya Password: ${newPass}\n\nYe employee ko bata dein — purana password ab kaam nahi karega.`);
}

/* ============ EXPORT: Work Tracker Report (matches uploaded SL/GI/NG/Restore tracker sheet) ============ */
async function exportWorkTrackerReport(){
  if(customers.length===0){ alert("Koi customer nahi hai export karne ke liye."); return; }
  let loadingToast = showToast("Preparing work tracker report...");
  try{ await ensureXlsxLib(); }
  catch(e){ hideToast(loadingToast); alert("Could not load Excel engine."); return; }

  const rows = customers.map(c=>{
    const workTypes = [];
    if((c.pendingWork||[]).some(w=>w.includes("SL")) || c.slWork) workTypes.push("SL");
    if((c.pendingWork||[]).some(w=>w.includes("GI")) || c.giWork) workTypes.push("GI");
    if((c.pendingWork||[]).some(w=>w.includes("NG")) || c.ngWork) workTypes.push("NG");
    return {
      Timestamp: c.createdAt ? new Date(c.createdAt).toLocaleString() : "",
      DATE: c.startAt || "",
      "C TYPE": (c.connectionType||[]).join(", ") || "",
      "CUSTMOR NAME": c.name || "",
      "FATHER/HUSBAND": c.fatherHusbandName || "",
      "PHONE NO": c.phone || "",
      "BP NO": c.bpNo || "",
      "AREA": c.area || "",
      "ADDRESS": c.address || "",
      "START AT": c.startAt || "",
      "METER NO": c.meterSerialNumber || "",
      "FORM": c.formNumber || "",
      "SL WORK": c.slWork || "Pending",
      "SL PAPER": c.slPaper || "Pending",
      "GI WORK": c.giWork || "Pending",
      "GI PAPER": c.giPaper || "Pending",
      "NG WORK": c.ngWork || "Pending",
      "NG PAPER": c.ngPaper || "Pending",
      "RESTORE WORK": c.restoreWork || "Pending",
      "RESTORE PAPER": c.restorePaper || "Pending",
      "JMR": c.jmrStatus || "Pending",
      "REMARK": c.remark || "",
    };
  });

  const wb = XLSX.utils.book_new();

function wsCollect(tab){
  const def = WS_DEFS[tab], arr = [];
  def.groups.forEach(g=>g.fields.forEach(f=>{
    const el = document.getElementById(`ws_${tab}_${f.i}`);
    let v = el ? String(el.value).trim() : "";
    if(v==="") arr[f.i] = null;
    else if(f.t==="number"){ const n = Number(v); arr[f.i] = isNaN(n) ? null : n; }
    else arr[f.i] = v;
  }));
  for(let i=0;i<arr.length;i++) if(arr[i]===undefined) arr[i] = null;
  while(arr.length && arr[arr.length-1]===null) arr.pop();
  return arr;
}

}

/* Sheet-row helpers: a customer's SL/GI/NG row is either the imported workbook row, or is built from what the
   technician recorded in the app (meter, material used, readings, completion) — so exports and Capitalisation
   include both old (imported) and new (app) work without double counting. */
function tejMatQty(c, re){ return ((c.wizMaterialUsed)||[]).reduce((s,m)=>s + (re.test(m.itemName||"") ? (Number(m.qty)||0) : 0), 0); }
function tejDate(iso){ return iso ? String(iso).slice(0,10) : null; }
function slRowFor(c){
  if(c.slRow) return c.slRow;
  const mdpe = tejMatQty(c, /MDPE.*20/i);
  if(!mdpe) return null;
  const r = new Array(8).fill(null); r[7] = mdpe; return r;   // col P = 20 MM pipe
}
function giRowFor(c){
  if(c.giRow) return c.giRow;
  if(!c.wizMeter && !c.wizMaterialUsed) return null;
  const r = new Array(48).fill(null);
  const m = c.wizMeter || {};
  r[0] = c.assignedTechnician ? techName(c.assignedTechnician) : null;             // WORKER
  r[1] = tejDate(c.wizWorkStartedAt);                                               // CHECK IN DATE
  r[2] = m.make || c.meterCompany || null; r[3] = m.type || null;                   // M/MAKER, TYPE
  const rd = ((c.wizTesting||{}).readings||[])[0]; r[4] = rd && rd.pg1 !== "" ? Number(rd.pg1)||rd.pg1 : null; // IN READING
  const q12 = tejMatQty(c,/GI\s*Pipe\s*1\/2/i), q34 = tejMatQty(c,/GI\s*Pipe\s*3\/4/i);
  r[5] = q12 || null; r[6] = q34 || null;                                           // GI PIPE 1/2", 3/4"
  r[9] = tejMatQty(c,/Elbow\s*1\/2/i) || null;                                      // ELBOW 1/2
  if(tejMatQty(c,/Regulator/i) > 0) r[38] = "INSTALD";                              // REGULTER
  if(((c.wizTesting||{}).readings||[]).length) r[44] = "PRESSURE CHECKED";          // PRESSURE CHACK
  if(c.jobStage === "done"){ r[46] = "GAS IN"; r[47] = tejDate(c.jobCompletedAt); } // GAS IN, CHECK OUT DATE
  return r;
}
function ngRowFor(c){
  if(c.ngRow) return c.ngRow;
  if(c.jobStage !== "done") return null;
  const r = new Array(10).fill(null);
  r[0] = tejDate((c.wizContact||{}).contactedAt); r[1] = c.assignedTechnician ? techName(c.assignedTechnician) : null;
  r[2] = "Done";                                                                    // READY FOR NG
  if(((c.wizTesting||{}).readings||[]).length) r[7] = "PRESSURE CHACKED";
  r[8] = tejDate(c.jobCompletedAt);                                                 // NG DATE
  return r;
}

function capSumRow(fn, idx){
  return customers.reduce((s,c)=>{ const v = (fn(c)||[])[idx]; const n = Number(v); return s + (v===null || v===undefined || v==="" || typeof v==="boolean" || isNaN(n) ? 0 : n); }, 0);
}
function capCountRow(fn, idx, re){
  return customers.reduce((s,c)=>{ const v = (fn(c)||[])[idx]; return s + (v!==null && v!==undefined && re.test(String(v).trim()) ? 1 : 0); }, 0);
}
function capAutoQty(k){
  const r = x=>Math.round(x*100)/100;
  switch(k){
    case "regulator": return capCountRow(giRowFor, 38, /INSTAL|REPLACE/i);
    case "gi12": return r(capSumRow(giRowFor, 5));
    case "gi34": return r(capSumRow(giRowFor, 6));
    case "mdpe20": return r(capSumRow(slRowFor, 7));
    case "warning": return capCountRow(giRowFor, 41, /^done$/i);
    case "conversion": return capCountRow(ngRowFor, 2, /^done$/i);
    case "iv": return r(capSumRow(giRowFor, 27));
    case "av": return r(capSumRow(giRowFor, 25));
  }
  return 0;
}
function capHeader(){ return {...CAP_HEADER_DEFAULT, ...(capConfig.header||{}), ...capDraft.header}; }
function capRate(it){
  if(capDraft.rates[it.id] !== undefined) return Number(capDraft.rates[it.id]) || 0;
  if(capConfig.rates && capConfig.rates[it.id] !== undefined) return Number(capConfig.rates[it.id]) || 0;
  return it.rate;
}
function capExtra(it){
  if(capDraft.manual[it.id] !== undefined) return Number(capDraft.manual[it.id]) || 0;
  return Number((capConfig.manual||{})[it.id]) || 0;
}
function capQty(it){ return Math.round(((it.qty ? capAutoQty(it.qty) : 0) + capExtra(it))*100)/100; }
function capCompute(){
  const mat = CAP_MATERIAL.map(it=>{ const q = capQty(it), rt = capRate(it); return {it, q, rt, amt: q*rt}; });
  const con = CAP_CONSTR.map(it=>{ const q = capQty(it), rt = capRate(it); return {it, q, rt, amt: q*rt}; });
  const matTotal = mat.reduce((s,x)=>s+x.amt,0), conTotal = con.reduce((s,x)=>s+x.amt,0);
  return {mat, con, matTotal, matGst: matTotal*0.18, matIncl: matTotal*1.18, conTotal, conGst: conTotal*0.18, conGrand: conTotal*1.18};
}
function capFmt(n){ return Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function capSet(kind, id, val){ capDraft[kind][id] = val; }
function capLine(x){
  const it = x.it;
  const auto = it.qty ? capAutoQty(it.qty) : 0;
  const qtyHtml = `<span class="font-bold">${x.q}</span> <span class="text-[10px] text-green-700">(auto ${auto})</span> <span class="text-[10px]">+ extra</span> <input type="number" step="any" class="ff-input" style="width:64px" value="${capExtra(it)}" oninput="capSet('manual','${it.id}',this.value)">`;
  return `<div class="border rounded p-2 mb-2 text-xs">
    <p class="font-bold">${it.name.length>70?it.name.slice(0,70)+"…":it.name} ${it.spec?`<span class="font-normal text-gray-500">(${it.spec})</span>`:""} <span class="font-normal text-gray-400">${it.unit}${it.sor?" • SOR "+it.sor:""}</span></p>
    ${it.qty?`<p class="text-[10px] text-gray-400">Auto: ${CAP_AUTO_LABEL[it.qty]} • extra se adjust karein</p>`:`<p class="text-[10px] text-gray-400">Source sheet me link nahi tha — quantity "extra" box me bharein</p>`}
    <div class="flex items-center gap-2 mt-1">
      <div class="flex-1">Qty: ${qtyHtml}</div>
      <div>Rate ₹ <input type="number" step="any" class="ff-input" style="width:100px" value="${x.rt}" oninput="capSet('rates','${it.id}',this.value)"></div>
    </div>
    <p class="text-right mt-1">Amount: <span class="font-bold">₹${capFmt(x.amt)}</span></p>
  </div>`;
}
function renderCapitalisation(){
  const d = capCompute(), h = capHeader();
  const hf = (key,label,rows)=>`<label class="ff-label">${label}</label><input class="ff-input mb-2" value="${(h[key]||"").replace(/"/g,"&quot;")}" oninput="capSet('header','${key}',this.value)">`;
  return `
    <button onclick="setView('overview')" class="text-sm text-[#0D904F] font-bold mb-2">← Back</button>
    <h2 class="font-bold text-gray-800 mb-1">📑 Capitalisation Sheet</h2>
    <p class="text-xs text-gray-500 mb-3">Quantity app ke data se <b>apne aap</b> update hoti hai (GI / SL / NG sheet). Aap sirf <b>rates</b> bharein aur Save dabayein.</p>
    <div class="bg-white rounded-lg shadow p-3 mb-3">
      ${hf("asset","Name of the Asset being capitalised")}
      ${hf("address","Address of the Asset")}
      ${hf("date","Date of Capitalisation")}
      ${hf("contractor","Name of Contractor")}
      ${hf("contractNo","Contract No.")}
    </div>
    <h3 class="font-bold text-sm text-gray-700 mb-2">Material Cost</h3>
    <div class="bg-white rounded-lg shadow p-3 mb-3">
      ${d.mat.map(capLine).join("")}
      <div class="text-sm space-y-1 border-t pt-2">
        <p class="flex justify-between"><span>TOTAL</span><b>₹${capFmt(d.matTotal)}</b></p>
        <p class="flex justify-between"><span>GST 18%</span><b>₹${capFmt(d.matGst)}</b></p>
        <p class="flex justify-between"><span>TOTAL INCL GST</span><b>₹${capFmt(d.matIncl)}</b></p>
      </div>
    </div>
    <h3 class="font-bold text-sm text-gray-700 mb-2">Construction Cost</h3>
    <div class="bg-white rounded-lg shadow p-3 mb-3">
      ${d.con.map(capLine).join("")}
      <div class="text-sm space-y-1 border-t pt-2">
        <p class="flex justify-between"><span>Total</span><b>₹${capFmt(d.conTotal)}</b></p>
        <p class="flex justify-between"><span>GST @ 18%</span><b>₹${capFmt(d.conGst)}</b></p>
        <p class="flex justify-between"><span>GRAND Total</span><b>₹${capFmt(d.conGrand)}</b></p>
      </div>
    </div>
    <button onclick="saveCapitalisation()" class="w-full bg-[#8430CE] text-white font-bold py-2.5 rounded-lg mb-2">💾 Save Rates</button>
    <button onclick="exportCapitalisationSheet()" class="w-full bg-[#EA8600] text-white font-bold py-2.5 rounded-lg mb-4">⬇ Export Capitalisation Sheet (Excel)</button>`;
}
async function saveCapitalisation(){
  if(!currentUser || currentUser.role !== "admin") return;
  const rates = {}, manual = {};
  [...CAP_MATERIAL, ...CAP_CONSTR].forEach(it=>{ rates[it.id] = capRate(it); manual[it.id] = capExtra(it); });
  const cfg = {rates, manual, header: capHeader()};
  if(db){
    try{ await db.doc("settings/capitalisation").set(cfg); }
    catch(e){ console.error(e); alert("Save nahi ho paya, dobara try karein."); return; }
  } else { capConfig = cfg; }
  capDraft = {rates:{}, manual:{}, header:{}};
  showToast("Capitalisation rates save ho gaye.");
  renderMain();
}
function capSheetAoa(){
  const d = capCompute(), h = capHeader();
  const rows = [];
  rows.push([h.title]);
  rows.push(["Name of the Asset being capitalised:","","",h.asset]);
  rows.push(["Address of the Asset being capitalised:","","",h.address]);
  rows.push(["Date of Capitalisation:","","",h.date]);
  rows.push(["Material Cost"]);
  rows.push(["Sl.No.","Name of Material","Unit","Technical Specification like Dia,etc.","Material Code as per SAP","Qty. Consumed *","Rates","Amount","SAP SIV"]);
  d.mat.forEach((x,i)=>rows.push([i+1,x.it.name,x.it.unit,x.it.spec,Number(x.it.sap),x.q,x.rt,x.amt,Number(x.it.siv)]));
  rows.push([]);
  rows.push(["","","","","","TOTAL","",d.matTotal]);
  rows.push(["","","","","","GST 18%","",d.matGst]);
  rows.push(["","","","","","TOTAL INCL GST","",d.matIncl]);
  rows.push(["","Please ensure that GRV/SIV already entered in SAP"]);
  rows.push([]);
  rows.push(["Construction Cost","","Unit","Technical Specification like Dia,etc.","Name of Contractor","Contract No.","SOR No. as per Contract","Qty. Executed","Rates","Amount","Remarks"]);
  rows.push(["Sl.No.","Description"]);
  d.con.forEach((x,i)=>rows.push([i+1,x.it.name,x.it.unit,x.it.spec,i===0?h.contractor:"",i===0?h.contractNo:"",x.it.sor,x.q,x.rt,x.amt]));
  rows.push(["","","","","","","","","Total",d.conTotal]);
  rows.push(["","","","","","","","","GTST @ 18%",d.conGst]);
  rows.push(["","","","","","","","","GRAND Total",d.conGrand]);
  rows.push(["","Please ensure that the  bill for quantity executed has either been paid or  liability provided for."]);
  return rows;
}

/* ============ EXPORT: TEJASAV Master Workbook (same sheets/columns as the GAIL master workbook + live Summary) ============ */
function tejNum(v){
  if(v===null || v===undefined || v==="") return "";
  if(typeof v === "number") return v;
  const s = String(v).trim();
  return (/^[1-9]\d{0,14}$/.test(s) || /^\d+\.\d+$/.test(s)) ? Number(s) : s;
}
function tejPlanOut(p){
  if(p==="Installment Scheme") return "INSTALLMENT";
  if(p==="Upfront Payment") return "UPFRONT";
  return (p||"").toUpperCase();
}
function tejOurStatus(c){
  if(c.ourStatus) return c.ourStatus;
  const m = {"NG Charged":"NG DONE", "RFC Done":"RFC DONE", "Completed":"DONE", "GI Done":"GAS IN", "Meter Installed":"GAS IN"};
  return m[c.workStatus] || "PENDING";
}
async function exportTejasavMasterWorkbook(){
  if(customers.length===0){ alert("Koi customer nahi hai export karne ke liye."); return; }
  const loadingToast = showToast("Master workbook ban raha hai...");
  try{ await ensureXlsxLib(); }
  catch(e){ hideToast(loadingToast); alert("Could not load Excel engine."); return; }

  const list = [...customers].sort((a,b)=>(a.sn||9999)-(b.sn||9999) || (a.createdAt||"").localeCompare(b.createdAt||""));
  list.forEach((c,i)=>{ c._sn = i+1; });
  const common = c=>[c._sn, c.name||"", c.fatherHusbandName||"", c.area||"", tejNum(c.bpNo), tejNum(c.meterSerialNumber), tejNum(c.phone), ((c.connectionType||[])[0]||"").toUpperCase()];
  const wb = XLSX.utils.book_new();
  const addSheet = (name, aoa, widths)=>{
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    if(widths) ws["!cols"] = widths.map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const title = [["M/S-TEJASAV"],["GGL- SONIPAT"],["TPI- REPL"]];

  // CUSTMOR DATA
  const custRows = list.map(c=>[
    ...common(c), c.tejStatus||"", tejOurStatus(c), c.email||"", c.houseNo||"", c.street||"", c.society||c.address||"",
    c.city||"", tejNum(c.pinCode), c.ownership||"", tejPlanOut(c.paymentPlan), c.lpg||"", c.payOrder||"", c.bankName||"",
    c.payDate||"", tejNum(c.payNo), tejNum(c.sdAmount), c.idType||"", tejNum(c.idNo), c.addrDocType||"", c.addIdNo||"", c.submitted||"", c.remark||""
  ]);
  addSheet("CUSTMOR DATA", [...title, TEJ_HEADERS["CUSTMOR DATA"], ...custRows], [6,22,20,18,13,14,13,9,10,11,22,9,18,34,9,9,12,12,6,10,18,9,14,10,12,14,18,12,10,14]);

  // SL (worker + status come from the app's live data)
  const slRows = list.map(c=>{
    const row = [...common(c), ...((slRowFor(c)||[]).map(v=>v===null?"":v))];
    row[8] = c.assignedTechnician ? techName(c.assignedTechnician) : "";
    row[10] = c.slWork==="Done" ? "DONE" : "";
    return row;
  });
  addSheet("SL", [["TEJASAV"],[],[], TEJ_HEADERS["SL"], ...slRows]);

  // GI / NG / RESTORETION keep their stored sheet rows (columns I onwards)
  const withRow = (fn)=>list.map(c=>[...common(c), ...((fn(c)||[]).map(v=>v===null?"":v))]);
  addSheet("GI", [["TEJASAV"],[],[], TEJ_HEADERS["GI"], ...withRow(giRowFor)]);
  addSheet("NG", [["TEJASAV"],[],[], TEJ_HEADERS["NG"], ...withRow(ngRowFor)]);
  addSheet("RESTORETION", [["TEJASAV"],[],[], TEJ_HEADERS["RESTORETION"], ...withRow(c=>c.restRow)]);
  addSheet("CONSENT", [["TEJASAV"],[],[], TEJ_HEADERS["CONSENT"], ...list.map(c=>[...common(c)])]);
  addSheet("ALL BILL TRACK", [TEJ_HEADERS["ALL BILL TRACK"], [],[],[], ...list.map(c=>[...common(c)])]);

  // MASTER SHEET (common data + live status of every work stage)
  const masterHdr = ["S N.","NAME","F//M/H NAME","AREA","BP NO.","METER NO.","PHONE","NEW/OLD","OUR STATUS","SL","GI","NG","RESTORATION","JMR","ASSIGNED TECHNICIAN","APP STATUS"];
  const masterRows = list.map(c=>[...common(c), tejOurStatus(c), c.slWork||"Pending", c.giWork||"Pending", c.ngWork||"Pending", c.restoreWork||"Pending", c.jmrStatus||"Pending", c.assignedTechnician?techName(c.assignedTechnician):"", c.status||""]);
  addSheet("MASTER SHEET", [["TEJASAV"],[],[], masterHdr, ...masterRows], [6,22,20,18,13,14,13,9,12,9,9,9,13,9,18,12]);
  addSheet("Capitalisation", capSheetAoa(), [6,34,8,22,16,14,16,14,16,14]);

  // SUMMARY (all counts calculated live from the app data)
  const count = (fn)=>{ const m = {}; list.forEach(c=>{ const k = fn(c) || "(blank)"; m[k] = (m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const sdTotal = list.reduce((s,c)=>s+(Number(c.sdAmount)||0),0);
  const done = key=>list.filter(c=>c[key]==="Done").length;
  const sum = [["M/S TEJASAV — GAIL SONIPAT — SUMMARY"],["Generated", new Date().toLocaleString()],[],
    ["TOTAL CUSTOMERS", list.length],["NEW", list.filter(c=>(c.connectionType||[]).includes("New")).length],["OLD", list.filter(c=>(c.connectionType||[]).includes("Old")).length],
    ["TOTAL SD AMOUNT (₹)", sdTotal],[],
    ["WORK DONE"],["SL DONE", done("slWork")],["GI DONE", done("giWork")],["NG DONE", done("ngWork")],["RESTORATION DONE", done("restoreWork")],[],
    ["BY OUR STATUS"], ...count(tejOurStatus),[],
    ["BY AREA"], ...count(c=>(c.area||"").replace(/\s+/g," ").trim().toUpperCase()),[],
    ["BY PLAN"], ...count(c=>tejPlanOut(c.paymentPlan)),[],
    ["PAPERWORK SUBMITTED"], ...count(c=>c.submitted),[],
    ["LPG"], ...count(c=>c.lpg),[],
    ["PAYMENT MODE"], ...count(c=>c.payOrder),[],
    ["CAPITALISATION (live)"], ["Material cost incl. GST (₹)", Math.round(capCompute().matIncl*100)/100], ["Construction cost grand total (₹)", Math.round(capCompute().conGrand*100)/100],[],
    ["ASSIGNMENT"], ["Pending (not assigned)", list.filter(c=>c.status==="pending").length], ["Assigned to technician", list.filter(c=>c.status==="assigned").length], ["Completed", list.filter(c=>c.status==="completed").length],[]];
  // GI material totals (summed from the stored GI sheet rows, labelled by the GI header)
  const giH = TEJ_HEADERS["GI"]; const colLabel = {}; let lastLabel = "";
  giH.forEach((h,i)=>{ if(h) lastLabel = h; if(i>=8) colLabel[i] = lastLabel.trim(); });
  const totals = {};
  list.forEach(c=>(giRowFor(c)||[]).forEach((v,j)=>{ const lab = colLabel[j+8]; const n = Number(v); if(lab && v!==null && v!=="" && typeof v!=="boolean" && !isNaN(n)) totals[lab] = (totals[lab]||0) + n; }));
  sum.push(["GI MATERIAL TOTALS"]);
  Object.entries(totals).filter(e=>e[1]>0).forEach(e=>sum.push([e[0], Math.round(e[1]*100)/100]));
  addSheet("SUMMARY", sum, [34,16]);

  XLSX.writeFile(wb, `TEJASAV_MASTER_WORKBOOK_${new Date().toISOString().slice(0,10)}.xlsx`);
  hideToast(loadingToast);
}

async function exportAllToExcel(){
  let loadingToast = showToast("Preparing Excel file...");
  try{ await ensureXlsxLib(); }
  catch(e){ hideToast(loadingToast); alert("Could not load Excel engine."); return; }

  const wb = XLSX.utils.book_new();

  // Forms sheets
  Object.keys(FORMS).forEach(formId=>{
    const form = FORMS[formId];
    const subs = submissions.filter(s=>s.formType===formId);
    if(subs.length===0) return;
    const allRows = subs.map(s=>{
      const row = {
        "Technician": techName(s.technicianUsername||""),
        "Saved At": s.createdAt ? new Date(s.createdAt).toLocaleString() : "",
        "GPS Lat": s.geotag ? s.geotag.lat : "",
        "GPS Lng": s.geotag ? s.geotag.lng : "",
      };
      form.sections.forEach(sec=>sec.fields.forEach(f=>{
        const v = (s.data.sections && s.data.sections[f.key]) || "";
        row[f.label] = f.type==="signature" ? (v?"✓ Signed":"") : v;
      }));
      (form.tables||[]).forEach(t=>{
        const rows = (s.data.tables && s.data.tables[t.key]) || [];
        rows.forEach((r,idx)=>{ t.columns.forEach(c=>{ row[`${t.heading} [Row ${idx+1}] ${c}`] = r[c] || ""; }); });
      });
      row["Material Used"] = (s.materialUsed||[]).map(m=>`${m.itemName}: ${m.qty}${m.unit||""}`).join(", ");
      return row;
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allRows), form.title.substring(0,31));
  });

  // Inventory sheet
  const invRows = (inventory.length?inventory:SEED_INVENTORY).map(i=>({Item:i.itemName, Unit:i.unit, "Current Stock":i.stockQty}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invRows), "Inventory");

  // Issues sheet
  const issueRows = issues.map(i=>({Technician:techName(i.technicianUsername), Item:i.itemName, Qty:i.qty, Unit:i.unit, "Issued At":i.issuedAt?new Date(i.issuedAt).toLocaleString():"", "Issued By":i.issuedBy}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(issueRows), "Material Issues");

  // Technician summary sheet
  const techRows = technicianList().map(t=>{
    const mySubs = submissions.filter(s=>s.technicianUsername===t.username);
    const bal = getTechBalances(t.username);
    return {
      Technician: t.name, Username: t.username,
      "Forms Filled": mySubs.length,
      "Total Material Balance": bal.reduce((s,b)=>s+b.balance,0),
      "Total Material Consumed": bal.reduce((s,b)=>s+b.consumed,0),
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(techRows), "Technician Summary");

  // Customers sheet
  const custRows = customers.map(c=>({
    Name:c.name, Phone:c.phone, Address:c.address, "BP No":c.bpNo||"",
    "Pending Work": (c.pendingWork||[]).join(", "), "Connection Type": (c.connectionType||[]).join(", "),
    Status:c.status, "Assigned Technician": c.assignedTechnician?techName(c.assignedTechnician):"",
    "Added By": techName(c.addedBy||""), "Survey Lat": c.geotag?c.geotag.lat:"", "Survey Lng": c.geotag?c.geotag.lng:"",
    "Created At": c.createdAt?new Date(c.createdAt).toLocaleString():""
  }));
  if(custRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(custRows), "Customers");

  XLSX.writeFile(wb, `PNG_Enterprise_Full_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
  hideToast(loadingToast);
}
